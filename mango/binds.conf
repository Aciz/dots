bind = SUPER,F1,spawn,firefox
bind = SUPER,F2,spawn,vesktop --ozone-platform-hint=auto
bind = SUPER,F3,spawn,elecwhat
bind = SUPER,F4,spawn,steam

bindl=NONE,XF86AudioRaiseVolume,spawn,~/scripts/volumectl.sh up
bindl=NONE,XF86AudioLowerVolume,spawn,~/scripts/volumectl.sh down
bindl=NONE,XF86AudioMute,spawn,~/scripts/volumectl.sh mute
# bind=SHIFT,XF86AudioMute,spawn,wpctl set-mute @DEFAULT_SOURCE@ toggle

bindl = NONE,XF86AudioNext,spawn,playerctl next
bindl = NONE,XF86AudioPause,spawn,playerctl play-pause
bindl = NONE,XF86AudioPlay,spawn,playerctl play-pause
bindl = NONE,XF86AudioPrev,spawn,playerctl previous
bindl = NONE,XF86AudioStop,spawn,playerctl stop

bind = SUPER+SHIFT,d,spawn,thunar

bind = CTRL,Print,spawn,flameshot gui
bind = ALT,v,spawn,kitty --class clipse -e clipse

bind = CTRL+ALT,l,spawn,swaylock

bind = SUPER,c,centerwin

bind = SHIFT,Print,spawn,~/scripts/wf-record-active.sh
