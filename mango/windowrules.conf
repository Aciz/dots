# tag assignments
windowrule = tags:1,appid:^(firefox)$
windowrule = tags:2,istagsilent:1,appid:^(vesktop)$
windowrule = tags:2,istagsilent:1,appid:^(elecwhat)$
windowrule = tags:2,istagsilent:1,appid:^(steam)$,title:^(Steam)$

# scroller maximized windows
windowrule = scroller_proportion:1.0,appid:^(firefox)$
# windowrule = scroller_proportion:1.0,appid:^(vesktop)$
windowrule = scroller_proportion:1.0,appid:^(blender)$
windowrule = scroller_proportion:1.0,appid:^(jetbrains-clion)$
windowrule = scroller_proportion:1.0,appid:^(com.obsproject.Studio)$,title:^(OBS).*
windowrule = scroller_proportion:1.0,appid:^(gimp)$,title:^(GNU Image Manipulation Program)$
windowrule = scroller_proportion:1.0,appid:^(resolve)$,title:^(DaVinci Resolve - ).*
windowrule = scroller_proportion:1.0,appid:^(affinity.real.exe)$,title:^(Affinity)$
windowrule = scroller_proportion:1.0,appid:^(NetRadiant-Custom)$

# floating windows
windowrule = isfloating:1,appid:(?i)^(thunar)$,title:^(Rename).*
windowrule = isfloating:1,appid:(?i)^(thunar)$,title:^(File Operation Progress|Confirm to replace files).*
windowrule = isfloating:1,title:^(Qalculate!)$
windowrule = isfloating:1,title:^(Qalculate!)$
windowrule = isfloating:1,appid:^(QtPack3r)$
windowrule = isfloating:1,appid:^(vlc)$
windowrule = isfloating:1,appid:^(xdg-desktop-portal-gtk)$
windowrule = isfloating:1,title:^(Welcome to CLion)$
windowrule = isfloating:1,appid:^(io.github.celluloid_player.Celluloid)$
windowrule = isfloating:1,title:^(mGBA).*
windowrule = isfloating:1,title:^(Floating Window - Show Me The Key)$

# tile main Steam window, float everything else (settings, prefs etc.)
windowrule = isfloating:1,appid:^(steam)$
windowrule = isfloating:0,appid:^(steam)$,title:^(Steam)$

# clipse
windowrule = isfloating:1,appid:^(clipse)$
windowrule = width:1536,height:1080,appid:^(clipse)$

# tearing for games
windowrule = force_tearing:1,vrr_only_fullscreen:1,appid:^(gamescope|steam_app_|ete|etl|nierautomata).*
