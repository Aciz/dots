exec-once = ~/.config/waybar/hyprland/launch.sh
exec-once = ~/scripts/jamesdsp.sh
# exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once = systemctl --user start hyprpolkitagent
exec-once = /usr/lib/xdg-desktop-portal -r
exec-once = hypridle
exec-once = mako
exec-once = nm-applet
exec-once = clipse -listen
exec-once = hyprpaper
exec-once = systemctl --user start random-wallpaper.service
exec-once = hyprctl setcursor pop 24
exec-once = xrandr --output DP-1 --primary # to setup primary monitor for proton/wine

