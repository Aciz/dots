# workspace assignments
windowrule = workspace 1 silent, match:class ^(brave-browser)$
windowrule = workspace 1 silent, match:class ^(firefox)$
windowrule = workspace 2 silent, match:class ^(vesktop)$
windowrule = workspace 2 silent, match:class ^(elecwhat)$
windowrule = workspace 2 silent, tile on, match:class ^(steam)$, match:title ^(Steam)$

# content assignments
windowrule = content game, match:class ^(gamescope).*
windowrule = content game, match:class ^(steam_app_).*
windowrule = content game, match:class ^(ete).*
windowrule = content game, match:class ^(etl).*
windowrule = content game, match:class ^(nierautomata).*

windowrule = monitor DP-1, float on, center on, immediate on, match:content 3

# fullscreen Guild Wars
# windowrule = fullscreen_state 2, match:title ^(Guild Wars).*

# floating windows
windowrule = float on, match:class ^(brave-).*(-Default)$ # Bitwarden extension unlock
# firefox is ass and this doesn't work, it creates the window initially with a different title
# windowrule = float, class:^(firefox)$, title:^(Extension: \(Bitwarden Password Manager\)).*
windowrule = float on, match:class (?i)^(thunar)$, match:title ^(File Operation Progress).*
windowrule = float on, match:class (?i)^(thunar)$, match:title ^(Rename).*
windowrule = float on, match:class ^(QtPack3r)$
windowrule = float on, match:class ^(hyprland-share-picker)$
windowrule = float on, match:class ^(io.github.celluloid_player.Celluloid)$
windowrule = float on, match:class ^(melonDS)$
windowrule = float on, match:class ^(vlc)$
windowrule = float on, match:class ^(xdg-desktop-portal-gtk)$
windowrule = float on, match:title ^(OpenGL pog)$
windowrule = float on, match:title ^(Qalculate!)$
windowrule = float on, match:title ^(Welcome to CLion)$
windowrule = float on, match:title ^(mGBA).*
windowrule = float on, pin on, match:title ^(Floating Window - Show Me The Key)$

# tile main Steam window, float everything else (settings, game preferences etc)
windowrule = float on, match:class ^(steam)$
windowrule = tile on, match:class ^(steam)$, match:title ^(Steam)$

# ditto for GIMP
windowrule = float on, match:class ^(gimp)$
windowrule = tile on, match:class ^(gimp)$, match:initial_title ^(GNU Image Manipulation Program)$
windowrule = float on, match:title ^(Export Image).*

# clipse
windowrule = float on, size (monitor_w*0.6) (monitor_h*0.75), match:class ^(clipse)$

# disable vrr for mpv
windowrule = no_vrr on, match:class ^(mpv)$
