$mainMod = SUPER # Sets "Windows" key as main modifier

# resize windows via resize submap
bind = $mainMod, R, submap, resize

submap = resize
# binde = , H, resizeactive, -10 0
# binde = , J, resizeactive, 0 10
# binde = , K, resizeactive, 0 -10
# binde = , L, resizeactive, 10 0
binde = , H, layoutmsg, colresize -0.05
binde = , L, layoutmsg, colresize +0.05
binde = , LEFT, layoutmsg, colresize -0.05
binde = , RIGHT, layoutmsg, colresize +0.05

binde = SHIFT, H, layoutmsg, colresize -0.1
binde = SHIFT, L, layoutmsg, colresize +0.1
binde = SHIFT, LEFT, layoutmsg, colresize -0.1
binde = SHIFT, RIGHT, layoutmsg, colresize +0.1

bind = $mainMod, R, submap, reset
bind = , Escape, submap, reset
submap = reset

# bind = $mainMod, F1, exec, brave
bind = $mainMod, F1, exec, firefox
bind = $mainMod, F2, exec, vesktop --ozone-platform=wayland --use-gl=egl
bind = $mainMod, F3, exec, elecwhat
bind = $mainMod, F4, exec, steam

bind = Control_L Alt_L, L, exec, hyprlock

bind = $mainMod SHIFT, O, exec, ~/scripts/jamesdsp.sh

bind = Control_L, Print, exec, swappyfile=$(hyprshot -m region -z -- echo); swappy -f $swappyfile -o $swappyfile
bind = SHIFT, Print, exec, swappyfile=$(hyprshot -m window -z -- echo); swappy -f $swappyfile -o $swappyfile
bind = Alt_L, V, exec, kitty --class clipse -e 'clipse'

# window groups
bind = $mainMod, W, togglegroup
bind = $mainMod, comma, changegroupactive, b
bind = $mainMod, period, changegroupactive, f

# bind = $mainMod, SPACE, exec, hyprctl dispatch focuswindow $(if [[ $(hyprctl activewindow -j | jq ."floating") == "true" ]]; then echo "tiled"; else echo "floating"; fi;)
